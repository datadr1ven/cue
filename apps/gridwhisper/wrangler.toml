# Cloudflare Worker — GridWhisper (F1 Telegram enroll + deliver)
#
#   npx wrangler login
#   npx wrangler kv namespace create GRIDWHISPER_KV
#   # paste id below
#   npx wrangler secret put TELEGRAM_TOKEN
#   npx wrangler secret put DELIVER_SECRET
#   # optional:
#   npx wrangler secret put TELEGRAM_ADMIN_IDS
#   npx wrangler deploy
#   # set webhook (see docs/cloudflare.md)

name = "gridwhisper"
main = "worker/index.js"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENROLL_OPEN = "true"
# Optional: WEBHOOK_SECRET = "pick-a-long-random-string"

# Create with: npx wrangler kv namespace create GRIDWHISPER_KV
# Then set id from the command output:
[[kv_namespaces]]
binding = "GRIDWHISPER_KV"
id = "8b75ba9cda9f468cbab274504e64bbd2"
