# Deploy GridWhisper Cloudflare Worker on push to main when worker-relevant paths change.
#
# Bias: prefer an extra deploy over missing one that needed a redeploy.
# F1 moments engine runs on the laptop (MQTT → POST /deliver) — NOT listed here.
#
# Same GitHub secrets as TPlus (reuse if already set):
#   CLOUDFLARE_API_TOKEN
#   CLOUDFLARE_ACCOUNT_ID
#
# Worker runtime secrets (wrangler secret put / dashboard — NOT GitHub):
#   TELEGRAM_TOKEN
#   DELIVER_SECRET
#   TELEGRAM_ADMIN_IDS   (optional)
#
# Manual: Actions → Deploy GridWhisper → Run workflow

name: Deploy GridWhisper

on:
  push:
    branches: [main]
    paths:
      # Product surface (enroll, help, /deliver, admin note/broadcast)
      - "worker/gridwhisper/**"
      - "wrangler.gridwhisper.toml"
      - "src/gridwhisper-commands.js"
      # Shared delivery helper used only if Worker later imports it — keep for safety if we wire it
      # (currently Worker is self-contained; package.json covers tooling)
      # Tooling / deps
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-gridwhisper.yml"
  workflow_dispatch:

concurrency:
  group: deploy-gridwhisper
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Smoke GridWhisper
        run: npm run smoke:gridwhisper

      - name: Check GitHub secrets present
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::error::Missing repository secret CLOUDFLARE_API_TOKEN"
            exit 1
          fi
          if [ "$HAS_ACCOUNT" != "true" ]; then
            echo "::error::Missing repository secret CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi
          echo "GitHub Cloudflare secrets are set (values not printed)."

      - name: Whoami (Cloudflare)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler whoami

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy -c wrangler.gridwhisper.toml
