# Deploy TPlus Cloudflare Worker on push to main when TPlus-relevant paths change.
#
# GitHub → Settings → Secrets and variables → Actions:
#   CLOUDFLARE_API_TOKEN   — "Edit Cloudflare Workers" (or custom: Account.Workers Scripts:Edit, Account:Read)
#   CLOUDFLARE_ACCOUNT_ID  — hex Account ID from Cloudflare dashboard sidebar
#
# Worker runtime secrets (NOT in GitHub — set once via wrangler / CF dashboard):
#   TELEGRAM_TOKEN
#   TELEGRAM_ADMIN_IDS
#
# KV namespace id is in wrangler.toml (committed).

name: Deploy TPlus

on:
  push:
    branches: [main]
    paths:
      # Worker entry + config
      - "worker/tplus/**"
      - "wrangler.toml"
      # Shared engine used by TPlus
      - "src/engine/pipeline.js"
      - "src/engine/gate.js"
      - "src/engine/config.js"
      - "src/engine/types.js"
      - "src/engine/domains/starship/**"
      # Missions + session (bundled into Worker)
      - "src/missions/**"
      - "src/starship-session.js"
      - "missions/**"
      # Deps / this workflow
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-tplus.yml"
  workflow_dispatch:

concurrency:
  group: deploy-tplus
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Validate missions
        run: npm run validate:missions

      - name: Smoke TPlus
        run: npm run smoke:tplus

      - name: Check Cloudflare secrets present
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "Missing GitHub secret CLOUDFLARE_API_TOKEN"
            exit 1
          fi
          if [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "Missing GitHub secret CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
