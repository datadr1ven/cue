# Deploy TPlus Cloudflare Worker on push to main when TPlus-relevant paths change.
#
# Bias: prefer an extra deploy over missing one that needed a redeploy.
# Still omit pure F1 / GridWhisper paths so everyday quali work doesn't redeploy Starship.
#
# GitHub → Settings → Secrets and variables → Actions:
#   CLOUDFLARE_API_TOKEN   — "Edit Cloudflare Workers" template (or Workers Scripts:Edit + Account:Read)
#   CLOUDFLARE_ACCOUNT_ID  — hex Account ID from Cloudflare dashboard sidebar
#
# Worker runtime secrets (Cloudflare dashboard / wrangler secret put — NOT GitHub):
#   TELEGRAM_TOKEN
#   TELEGRAM_ADMIN_IDS
#
# Manual: Actions → Deploy TPlus → Run workflow
#   (use after shared-only tweaks you care about, e.g. src/engine/config.js defaults)

name: Deploy TPlus

on:
  push:
    branches: [main]
    paths:
      # Product surface
      - "worker/tplus/**"
      - "wrangler.toml"
      - "src/tplus-commands.js"
      - "src/starship-session.js"
      # Missions (git timelines + worker bundle)
      - "src/missions/**"
      - "missions/**"
      # Starship domain + Cue core used by createStarshipSession / pipeline
      - "src/engine/domains/starship/**"
      - "src/engine/pipeline.js"
      - "src/engine/gate.js"
      - "src/engine/types.js"
      # Tooling / deps (wrangler version, etc.) — over-deploy OK
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-tplus.yml"
  workflow_dispatch:

concurrency:
  group: deploy-tplus
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Validate missions
        run: npm run validate:missions

      - name: Smoke TPlus
        run: npm run smoke:tplus

      - name: Check GitHub secrets present
        env:
          # Do not echo values; only check non-empty
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::error::Missing repository secret CLOUDFLARE_API_TOKEN"
            exit 1
          fi
          if [ "$HAS_ACCOUNT" != "true" ]; then
            echo "::error::Missing repository secret CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi
          echo "GitHub Cloudflare secrets are set (values not printed)."

      - name: Whoami (Cloudflare)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler whoami

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
