# Deploy TPlus Cloudflare Worker on push to main when TPlus-relevant paths change.
#
# Bias: prefer an extra deploy over missing one that needed a redeploy.
# Still omit pure F1 / GridWhisper paths so everyday quali work doesn't redeploy Starship.
#
# GitHub → Settings → Secrets and variables → Actions:
#   CLOUDFLARE_API_TOKEN
#   CLOUDFLARE_ACCOUNT_ID
#
# Worker runtime secrets (Cloudflare dashboard / wrangler secret put — NOT GitHub):
#   TELEGRAM_TOKEN
#   TELEGRAM_ADMIN_IDS
#   TPLUS_SUGGEST_SECRET
#
# Manual: Actions → Deploy TPlus → Run workflow

name: Deploy TPlus

on:
  push:
    branches: [main]
    paths:
      - "apps/tplus/**"
      - "packages/cue/src/engine/domains/starship/**"
      - "packages/cue/src/engine/pipeline.js"
      - "packages/cue/src/engine/gate.js"
      - "packages/cue/src/engine/types.js"
      - "packages/cue/src/telegram-inbox.js"
      - "packages/cue/package.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-tplus.yml"
  workflow_dispatch:

concurrency:
  group: deploy-tplus
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Validate missions
        run: npm run validate:missions

      - name: Smoke TPlus
        run: npm run smoke:tplus

      - name: Check GitHub secrets present
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::error::Missing repository secret CLOUDFLARE_API_TOKEN"
            exit 1
          fi
          if [ "$HAS_ACCOUNT" != "true" ]; then
            echo "::error::Missing repository secret CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi
          echo "GitHub Cloudflare secrets are set (values not printed)."

      - name: Whoami (Cloudflare)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler whoami

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run cf:deploy:tplus
