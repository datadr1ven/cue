# Cloudflare Worker — GridWhisper (F1 Telegram enroll + deliver)
#
#   npx wrangler login
#   npx wrangler kv namespace create GRIDWHISPER_KV
#   # paste id below
#   npx wrangler secret put TELEGRAM_TOKEN -c wrangler.gridwhisper.toml
#   npx wrangler secret put DELIVER_SECRET -c wrangler.gridwhisper.toml
#   # optional:
#   npx wrangler secret put TELEGRAM_ADMIN_IDS -c wrangler.gridwhisper.toml
#   npx wrangler deploy -c wrangler.gridwhisper.toml
#   # set webhook (see docs/gridwhisper-cloudflare.md)

name = "gridwhisper"
main = "worker/gridwhisper/index.js"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENROLL_OPEN = "true"
# Optional: WEBHOOK_SECRET = "pick-a-long-random-string"

# Create with: npx wrangler kv namespace create GRIDWHISPER_KV -c wrangler.gridwhisper.toml
# Then set id from the command output:
[[kv_namespaces]]
binding = "GRIDWHISPER_KV"
id = "8b75ba9cda9f468cbab274504e64bbd2"
